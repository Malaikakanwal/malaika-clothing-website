<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Malaika Clothes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar solid" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">✦</span> Malaika Clothes
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html"   class="nav-link">Home</a></li>
      <li><a href="shop.html"    class="nav-link">Shop</a></li>
      <li><a href="about.html"   class="nav-link">About</a></li>
      <li><a href="contact.html" class="nav-link">Contact</a></li>
      <li><a href="signup.html"  class="nav-link nav-cta">Sign Up</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ===== AUTH PAGE ===== -->
<main class="auth-page">
  <div class="auth-card">

    <a href="index.html" class="auth-logo">✦ Malaika Clothes</a>

    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email or Username</label>
        <input
          class="form-input"
          type="text"
          id="loginEmail"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input
          class="form-input"
          type="password"
          id="loginPassword"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>
      </div>

      <a href="#" class="forgot-link">Forgot Password?</a>

      <button type="submit" class="btn btn-primary btn-full btn-lg">
        Login
      </button>
    </form>

    <div class="auth-foot">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Malaika Clothes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar solid" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">✦</span> Malaika Clothes
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html"   class="nav-link">Home</a></li>
      <li><a href="shop.html"    class="nav-link">Shop</a></li>
      <li><a href="about.html"   class="nav-link">About</a></li>
      <li><a href="contact.html" class="nav-link">Contact</a></li>
      <li><a href="login.html"   class="nav-link nav-cta">Login</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ===== AUTH PAGE ===== -->
<main class="auth-page">
  <div class="auth-card">

    <a href="index.html" class="auth-logo">✦ Malaika Clothes</a>

    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Join Malaika Clothes today</p>
    </div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input
          class="form-input"
          type="text"
          id="fullName"
          name="name"
          placeholder="Your full name"
          autocomplete="name"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="signupEmail">Email Address</label>
        <input
          class="form-input"
          type="email"
          id="signupEmail"
          name="email"
          placeholder="your@email.com"
          autocomplete="email"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-input"
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input
          class="form-input"
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Repeat your password"
          autocomplete="new-password"
          required>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">
        Sign Up
      </button>
    </form>

    <div class="auth-foot">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
